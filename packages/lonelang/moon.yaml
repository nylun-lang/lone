project:
  description: lonelang parser

tasks:
  gen-parser:
    type: build
    script: |
      IR_ARTEFACT="./_artefact"
      PEG_GRAMMAR="./src/parser.peg"
      PARSER_OUTFILE="./src/parser/parser.go"
      touch "$IR_ARTEFACT"
      pigeon -o "$IR_ARTEFACT" "$PEG_GRAMMAR" || rm "$IR_ARTEFACT"
      cat "$IR_ARTEFACT" > "$PARSER_OUTFILE" && rm "$IR_ARTEFACT"

  compile:
    type: build
    command: go build -o out/ .

  build:
    type: build
    deps:
      - ~:gen-parser
      - ~:compile

  test:
    type: test
    command: go test -v ./src/parser
    inputs:
      - ./src/parser/*

  dev:
    type: run
    deps:
      - ~:build
      - ~:test
